name: Learning resource checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: resource-checks-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  verify:
    env:
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.12']
        include:
          # Python.org's current default download; core profile only.
          - os: windows-latest
            python: '3.13'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install core dependencies
        run: python -m pip install -e ".[visualization,regression,verification]" -c environments/constraints-tested.txt
      - name: Check core environment
        run: python scripts/preflight.py --profile core
      - name: Verify curriculum, source structure, and notebook format
        run: python scripts/check_repository.py
      - name: Register this environment as a Jupyter kernel
        run: python -m ipykernel install --user --name ml-ai-core
      - name: Download reviewed bike data through the CLI
        run: python examples/bike-demand/scripts/study.py download --run runs/datasets/bike-sharing
      - name: Check core behavior including real data
        env:
          ML_AI_REAL_DATA: '1'
        run: python -m unittest discover -s tests -v
      - name: Execute core notebooks
        run: python scripts/check_notebook.py --group core --kernel ml-ai-core
      - uses: actions/upload-artifact@v4
        with:
          name: verified-core-${{ matrix.os }}-py${{ matrix.python }}
          path: runs/verified/
  framework-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      ML_AI_HEAVY: '1'
      USE_TF: '0'
      HF_HUB_DISABLE_XET: '1'
      TF_CPP_MIN_LOG_LEVEL: '2'
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
      TF_NUM_INTEROP_THREADS: '2'
      TF_NUM_INTRAOP_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install CPU-only PyTorch
        run: python -m pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
      - name: Install isolated framework dependencies
        run: python -m pip install -e ".[regression,visualization,neural,language,deployment,verification]" -c environments/constraints-neural.txt
      - name: Check framework environment
        run: python scripts/preflight.py --profile frameworks
      - name: Register the framework Jupyter kernel
        run: python -m ipykernel install --user --name ml-ai-frameworks
      - name: Exercise actual framework, fine-tuning, CLI, and app behavior
        run: python -m unittest discover -s tests -p test_continuation_heavy.py -v
      - name: Execute framework notebooks
        run: python scripts/check_notebook.py --group frameworks --kernel ml-ai-frameworks
      - uses: actions/upload-artifact@v4
        with:
          name: verified-frameworks
          path: runs/verified/
  build-site:
    needs: [verify, framework-checks]
    runs-on: ubuntu-latest
    env:
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install site and data dependencies
        run: python -m pip install -e ".[visualization,regression,verification]" -c environments/constraints-tested.txt
      - uses: actions/download-artifact@v4
        with:
          name: verified-core-ubuntu-latest-py3.12
          path: runs/verified/
      - uses: actions/download-artifact@v4
        with:
          name: verified-frameworks
          path: runs/verified/
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install reading-site tool
        run: npm ci --ignore-scripts
      - name: Assemble site with actual verified reports
        run: npm run build
      - name: Check every generated page and local link
        run: npm run check
      - name: Check project-prefix HTTP routes
        run: python scripts/check_http_routes.py
      - name: Install reading-site browser
        run: npx playwright install --with-deps chromium
      - name: Check rendered reading pages
        run: node scripts/check_browser.mjs
      - name: Check source and data archives and extracted CLI
        run: python scripts/check_downloads.py
      - name: Build package
        run: python -m pip wheel . --no-deps --wheel-dir dist
      - name: Exercise the installed wheel outside the checkout
        run: python scripts/check_wheel.py
      - uses: actions/upload-artifact@v4
        with:
          name: complete-reading-site
          path: site/

      - uses: actions/upload-artifact@v4
        with:
          name: reading-browser-review
          path: runs/browser-review/
  deploy-pages:
    # The owner enables publication explicitly after the release review.
    # Pull requests always build without deploying.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.PUBLISH_READING_SITE == 'true'
    needs: build-site
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: complete-reading-site
          path: site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/
      - id: deployment
        uses: actions/deploy-pages@v4
