name: Learning resource checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: resource-checks-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  verify:
    env:
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install tested data and visualization dependencies
        run: python -m pip install -e ".[visualization,regression]" -c environments/constraints-tested.txt
      - name: Download reviewed public data through the CLI
        run: python examples/bike-demand/scripts/study.py download --run runs/datasets/bike-sharing
      - name: Check data and regression behavior
        env:
          ML_AI_REAL_DATA: '1'
        run: python -m unittest discover -s tests -v
      - name: Check notebook code
        run: python scripts/check_notebook.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install reading-site tool
        run: npm install --ignore-scripts
      - name: Build reading site and controlled downloads
        run: npm run build
      - name: Check generated links and structure
        run: npm run check
      - name: Check source archive and extracted CLI
        run: python scripts/check_downloads.py
      - uses: actions/upload-artifact@v4
        with:
          name: reading-site-${{ matrix.os }}
          path: site/

  framework-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      ML_AI_HEAVY: '1'
      USE_TF: '0'
      HF_HUB_DISABLE_XET: '1'
      TF_CPP_MIN_LOG_LEVEL: '2'
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
      TF_NUM_INTEROP_THREADS: '2'
      TF_NUM_INTRAOP_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install CPU-only PyTorch
        run: python -m pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
      - name: Install isolated framework dependencies
        run: python -m pip install -e ".[regression,visualization,neural,language,deployment]" -c environments/constraints-neural.txt
      - name: Exercise actual neural, language, fine-tuning, and app workflows
        run: python -m unittest discover -s tests -p test_continuation_heavy.py -v
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: framework-evidence
          path: |
            runs/datasets/*/provenance.json
