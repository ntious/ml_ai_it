name: Learning resource checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: resource-checks-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  verify:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install tested data and visualization dependencies
        run: python -m pip install -e ".[visualization,regression]" -c environments/constraints-tested.txt
      - name: Check data and regression behavior
        env:
          ML_AI_REAL_DATA: '1'
        run: python -m unittest discover -s tests -v
      - name: Check notebook code
        run: python scripts/check_notebook.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install reading-site tool
        run: npm install --ignore-scripts
      - name: Build reading site and controlled downloads
        run: npm run build
      - name: Check generated links and structure
        run: npm run check
      - uses: actions/upload-artifact@v4
        with:
          name: reading-site-${{ matrix.os }}
          path: site/
