name: Clean up completed branches
on:
  push:
    branches: [main]
    paths: ['.github/workflows/cleanup-merged-branches.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cleanup:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Delete only completed branches contained in main
        uses: actions/github-script@v9
        with:
          script: |
            const allowed = [
              'improvement/site-experience', 'improvement/public-readiness',
              'development/github-pages', 'development/module-03-foundation',
              'docs/independent-review-wording', 'docs/learner-readme-and-hygiene',
              'feature/capstone-exemplar', 'improvement/mixed-background-learning',
              'improvement/applied-teaching-prototype', 'improvement/phase-a-publication', 'improvement/phase-b-frameworks'
            ];
            const rows = [];
            for (const branch of allowed) {
              let current;
              try {
                current = (await github.rest.repos.getBranch({...context.repo, branch})).data;
              } catch (error) {
                if (error.status !== 404) throw error;
                rows.push([branch, 'Already absent']); continue;
              }
              if (current.protected) {
                rows.push([branch, 'Protected: retained']); continue;
              }
              const comparison = (await github.rest.repos.compareCommitsWithBasehead({
                ...context.repo, basehead: `main...${current.commit.sha}`
              })).data;
              if (!['behind', 'identical'].includes(comparison.status)) {
                rows.push([branch, 'Unmerged changes: retained']); continue;
              }
              const latest = (await github.rest.repos.getBranch({...context.repo, branch})).data;
              if (latest.commit.sha !== current.commit.sha) {
                rows.push([branch, 'Changed during check: retained']); continue;
              }
              await github.rest.git.deleteRef({...context.repo, ref: `heads/${branch}`});
              rows.push([branch, 'Deleted; history preserved in main']);
            }
            await core.summary.addHeading('Completed branch cleanup')
              .addTable([[{data: 'Branch', header: true}, {data: 'Result', header: true}], ...rows]).write();
