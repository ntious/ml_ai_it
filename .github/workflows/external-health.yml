name: External links and pinned sources
on:
  schedule:
    - cron: '23 9 * * 1'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: external-health
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/check_external_health.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: external-health
          path: runs/external-health.json
  report:
    needs: check
    if: always()
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/github-script@v9
        env:
          CHECK_RESULT: ${{ needs.check.result }}
        with:
          script: |
            const title = 'External links or pinned sources need review';
            const issues = await github.paginate(github.rest.issues.listForRepo, {...context.repo, state: 'open', creator: 'github-actions[bot]', per_page: 100});
            const existing = issues.find(i => i.title === title && !i.pull_request);
            const url = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            if (process.env.CHECK_RESULT === 'success') {
              if (existing) await github.rest.issues.update({...context.repo, issue_number: existing.number, state: 'closed'});
            } else {
              const body = `The weekly/manual external health check did not pass. Inspect the [run and JSON artifact](${url}). HTTP access failures may reflect authentication, throttling or bot protection rather than a dead page. A checksum mismatch requires source review; do not automatically replace the approved digest. No datasets or checksums were changed by this job.`;
              if (existing) await github.rest.issues.update({...context.repo, issue_number: existing.number, body});
              else await github.rest.issues.create({...context.repo, title, body});
            }
