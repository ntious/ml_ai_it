name: Publish reviewed GitHub Pages site
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Successful main-branch Learning resource checks run ID
        required: true
        type: string
      reviewed_sha:
        description: Full source commit SHA reviewed for publication
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  publish:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      actions: read
      pages: write
      id-token: write
    env:
      RELEASE_RUN_ID: ${{ inputs.run_id }}
      REVIEWED_SHA: ${{ inputs.reviewed_sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate reviewed verification run and artifact
        id: review
        uses: actions/github-script@v7
        with:
          script: |
            const { pathToFileURL } = require('node:url');
            const path = require('node:path');
            const { validateRelease } = await import(pathToFileURL(path.join(process.env.GITHUB_WORKSPACE, 'scripts/pages_release.mjs')).href);
            const value = process.env.RELEASE_RUN_ID;
            if (!/^[0-9]+$/.test(value) || !Number.isSafeInteger(Number(value))) throw new Error('Use a numeric workflow run ID.');
            const runID = Number(value);
            const { data: run } = await github.rest.actions.getWorkflowRun({ ...context.repo, run_id: runID });
            const artifacts = await github.paginate(github.rest.actions.listWorkflowRunArtifacts, { ...context.repo, run_id: runID, per_page: 100 });
            validateRelease(run, artifacts, process.env.REVIEWED_SHA, context.repo.owner + '/' + context.repo.repo, context.payload.repository.default_branch);
            core.setOutput('run_id', String(runID));
      - name: Download the complete tested site
        uses: actions/download-artifact@v4
        with:
          name: complete-reading-site
          path: site
          run-id: ${{ steps.review.outputs.run_id }}
          github-token: ${{ github.token }}
      - name: Verify the downloaded source/run manifest
        run: node --input-type=module -e "import fs from 'node:fs'; import { validateManifest } from './scripts/pages_release.mjs'; validateManifest(JSON.parse(fs.readFileSync('site/site-build.json', 'utf8')), process.env.REVIEWED_SHA, process.env.RELEASE_RUN_ID, 'https://github.com/' + process.env.GITHUB_REPOSITORY);"
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Package the reviewed static artifact for Pages
        uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
