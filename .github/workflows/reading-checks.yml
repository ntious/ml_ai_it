name: Reading resource checks
on:
  pull_request:
    paths:
      - 'docs/**'
      - 'templates/**'
      - 'curriculum/connections.json'
      - 'README.md'
      - 'CHANGELOG.md'
      - 'scripts/build_site.mjs'
      - 'scripts/site_components.mjs'
      - 'scripts/check_browser.mjs'
      - 'scripts/check_site.py'
      - 'scripts/check_source_links.py'
      - 'tests/test_connected_case.py'
      - 'tests/browser/**'
      - '.github/workflows/reading-checks.yml'
permissions:
  contents: read
  actions: read
concurrency:
  group: reading-checks-${{ github.head_ref }}
  cancel-in-progress: true
jobs:
  reading:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - name: Confirm that verified computational outputs can be reused
        id: baseline
        uses: actions/github-script@v7
        with:
          script: |
            // This fast route applies only to reading/frontend changes. The
            // full course workflow remains authoritative for changed models.
            const base = context.payload.pull_request.base.sha;
            const head = context.payload.pull_request.head.sha;
            const comparison = await github.rest.repos.compareCommits({ ...context.repo, base, head });
            const allowed = name => /^(docs\/|templates\/|tests\/browser\/)/.test(name) ||
              ['README.md', 'CHANGELOG.md', 'curriculum/connections.json',
               'scripts/build_site.mjs', 'scripts/site_components.mjs',
               'scripts/check_browser.mjs', 'scripts/check_site.py',
               'scripts/check_source_links.py', 'tests/test_connected_case.py',
               '.github/workflows/reading-checks.yml'].includes(name);
            const files = comparison.data.files || [];
            if (!files.length || files.length >= 300 || !files.every(file => allowed(file.filename) && (!file.previous_filename || allowed(file.previous_filename)))) {
              core.notice('Computational sources or a large change require the full course workflow; no outputs are reused.');
              core.setOutput('reuse', 'false'); return;
            }
            const runs = await github.rest.actions.listWorkflowRuns({ ...context.repo,
              workflow_id: 'checks.yml', branch: context.payload.repository.default_branch,
              event: 'push', status: 'success', head_sha: base, per_page: 20 });
            const run = runs.data.workflow_runs.find(item => item.head_sha === base && item.conclusion === 'success');
            if (!run) {
              core.notice('No successful full verification at the base commit; wait for the full course workflow.');
              core.setOutput('reuse', 'false'); return;
            }
            core.setOutput('reuse', 'true'); core.setOutput('run_id', String(run.id));
            await core.summary.addHeading('Reading verification baseline')
              .addRaw('Unchanged computational sources; verified outputs from commit ' + base + ', run ' + run.id + '.')
              .write();
      - uses: actions/setup-python@v5
        if: steps.baseline.outputs.reuse == 'true'
        with:
          python-version: '3.12'
      - name: Install core build and verification dependencies
        if: steps.baseline.outputs.reuse == 'true'
        run: python -m pip install -e ".[visualization,regression,verification]" -c environments/constraints-tested.txt
      - uses: actions/download-artifact@v4
        if: steps.baseline.outputs.reuse == 'true'
        with:
          name: verified-core-ubuntu-latest-py3.12
          path: runs/verified/
          run-id: ${{ steps.baseline.outputs.run_id }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        if: steps.baseline.outputs.reuse == 'true'
        with:
          name: verified-frameworks
          path: runs/verified/
          run-id: ${{ steps.baseline.outputs.run_id }}
          github-token: ${{ github.token }}
      - uses: actions/setup-node@v7
        if: steps.baseline.outputs.reuse == 'true'
        with:
          node-version: '22'
      - name: Check source routes and unchanged module outcomes
        if: steps.baseline.outputs.reuse == 'true'
        run: |
          python scripts/check_repository.py
          python -m unittest discover -s tests -p test_connected_case.py -v
      - name: Install reading-site dependencies
        if: steps.baseline.outputs.reuse == 'true'
        run: npm ci --ignore-scripts
      - name: Build and check the current reading site
        if: steps.baseline.outputs.reuse == 'true'
        env:
          SITE_SOURCE_REF: ${{ github.event.pull_request.head.sha }}
        run: |
          npm run build
          npm run check
          python scripts/check_http_routes.py
      - name: Install the pinned Chromium browser
        if: steps.baseline.outputs.reuse == 'true'
        run: npx playwright install --with-deps chromium
      - name: Exercise connected reading and the existing site journeys
        if: steps.baseline.outputs.reuse == 'true'
        run: npm run check:browser
      - name: Check rendered reading pages including the new case
        if: steps.baseline.outputs.reuse == 'true'
        run: node scripts/check_browser.mjs
      - uses: actions/upload-artifact@v7
        if: always() && steps.baseline.outputs.reuse == 'true'
        with:
          name: reading-change-browser-evidence
          path: |
            browser-results/
            runs/browser-review/
      - uses: actions/upload-artifact@v7
        if: success() && steps.baseline.outputs.reuse == 'true'
        with:
          name: reading-change-site
          path: site/
          include-hidden-files: true
