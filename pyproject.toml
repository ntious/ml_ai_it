[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "practical-ml-ai"
version = "0.2.0"
description = "Reusable examples for practical machine learning and AI education"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["numpy>=2,<3", "pandas>=2.2,<3"]
license = {text = "MIT"}

[project.scripts]
ml-ai-prepare = "practical_ml_ai.data.events:main"

[tool.setuptools.packages.find]
where = ["src"]
